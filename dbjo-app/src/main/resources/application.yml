spring:
  datasource:
    url: jdbc:hsqldb:mem:dbjo;DB_CLOSE_DELAY=-1
    driver-class-name: org.hsqldb.jdbc.JDBCDriver
    username: SA
    password:
  sql:
    init:
      mode: never

server:
  port: 8433
  ssl:
    enabled: true
    certificate: classpath:localhost.crt
    certificate-private-key: classpath:localhost.key

rocks:
  path: ./data/rocksdb
