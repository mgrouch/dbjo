###############################################################################
# dbjo-enum-overrides.properties
#
# Purpose:
#   Tell dbjo codegen that certain TABLE.COLUMN values should be represented
#   in Java as a generated Enum (from an enum table), and how to map between
#   DB values <-> Enum instances.
#
# Key idea:
#   You specify the enum table, and optionally which UNIQUE column to use
#   as the lookup key (defaults to enum table PK if omitted).
#
# Format (one override):
#   <schema>.<table>.<column> = <enumSchema>.<enumTable>[:<enumKeyColumn>][,strictUnique=<true|false>]
#
# Examples:
#   PUBLIC.country_enum.global_region = PUBLIC.global_region_enum
#       -> map column country_enum.global_region to GlobalRegionEnum using PK of global_region_enum
#
#   PUBLIC.country_enum.global_region = PUBLIC.global_region_enum:code,strictUnique=true
#       -> same, but explicit key column ("code") and require that column to be UNIQUE
#
# Notes:
# - schema is required (use PUBLIC for HSQLDB default).
# - enumKeyColumn:
#     * if omitted: assume enum table PRIMARY KEY.
#     * if present: must be UNIQUE when strictUnique=true.
# - strictUnique:
#     * if true: generator should validate uniqueness in metadata; fail fast if not unique.
#     * if false: generator may allow it (but lookup may be ambiguous at runtime).
###############################################################################

###############################################################################
# Countries: country_enum table
###############################################################################

# country_enum.global_region is a FK to global_region_enum(code) -> GlobalRegionEnum
PUBLIC.country_enum.global_region = PUBLIC.global_region_enum:code,strictUnique=true

# (Optional) If you also have some table referencing countries:
# Example: some_table.country_code2 -> country_enum(code2)
# PUBLIC.some_table.country_code2 = PUBLIC.country_enum:code2,strictUnique=true


###############################################################################
# Regions: global_region_enum table
###############################################################################

# If some business table references global_region by code:
# PUBLIC.some_table.global_region = PUBLIC.global_region_enum:code,strictUnique=true


###############################################################################
# Currencies: ccy_enum table (adjust names to your actual schema)
###############################################################################

# Example: payments.currency_code -> ccy_enum(code)
# Replace "payments" / "payment" / column names with yours.
# PUBLIC.payment.currency_code = PUBLIC.ccy_enum:code,strictUnique=true

# If you store numeric currency code and want mapping via a unique field (NOT the PK),
# only do this if ccy_enum.numeric_code is UNIQUE (and you want that key):
# PUBLIC.payment.currency_numeric = PUBLIC.ccy_enum:numeric_code,strictUnique=true


###############################################################################
# Convenience aliases (optional patterns you may use across many tables)
###############################################################################

# If many tables use "ccy" as column name:
# PUBLIC.*.ccy = PUBLIC.ccy_enum:code,strictUnique=true
#
# If your generator does NOT support wildcards, ignore this block.
###############################################################################
