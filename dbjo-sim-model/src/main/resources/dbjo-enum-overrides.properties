###############################################################################
# dbjo-enum-overrides.properties
#
# Purpose:
#   Tell dbjo codegen that certain TABLE.COLUMN values should be represented
#   in Java as a generated Enum (from an enum table), and how to map between
#   DB values <-> Enum instances.
#
# Key format:
#   <table>.<column>
#   <schema>.<table>.<column>
#
# Value format (THIS IS WHAT THE CURRENT GENERATOR PARSES):
#   table:<enumTable>
#   table:<enumSchema>.<enumTable>
#   table:<enumSchema>.<enumTable>#by:<enumKeyColumn>
#
# Notes:
# - If #by: is omitted, the enum table PRIMARY KEY column is used.
# - Uniqueness enforcement is GLOBAL, not per-override:
#     Maven:  <strictUnique>true|false</strictUnique>
#     CLI:    --strictUnique=true|false
#     System: -Ddbjo.strictUnique=true|false
###############################################################################

###############################################################################
# Countries: country_enum table
###############################################################################

# country_enum.global_region maps to GlobalRegionEnum by global_region_enum.code
PUBLIC.country_enum.global_region = table:PUBLIC.global_region_enum#by:code

# Example: some_table.country_code2 -> country_enum.code2
# PUBLIC.some_table.country_code2 = table:PUBLIC.country_enum#by:code2

###############################################################################
# Regions: global_region_enum table
###############################################################################

# Example: some_table.global_region -> global_region_enum.code
# PUBLIC.some_table.global_region = table:PUBLIC.global_region_enum#by:code

###############################################################################
# Currencies: ccy_enum table (adjust names to your actual schema)
###############################################################################

# Example: payment.currency_code -> ccy_enum.code
# PUBLIC.payment.currency_code = table:PUBLIC.ccy_enum#by:code

# Example: mapping via a UNIQUE numeric_code (only if truly UNIQUE)
# PUBLIC.payment.currency_numeric = table:PUBLIC.ccy_enum#by:numeric_code
###############################################################################
